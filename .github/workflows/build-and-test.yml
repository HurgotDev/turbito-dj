name: Build & Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Debug: the Universal LTO Release build (~35 min) runs only in release.yml.
          - name: macOS
            os: macos-latest
            configure: macos-debug
            preset: macos-debug
            package: ditto -c -k --keepParent "build/macos-debug/src/TurbitoDJ_artefacts/Debug/Turbito DJ.app" "$ZIP"
          - name: Windows
            os: windows-latest
            configure: windows
            preset: windows-release
            package: Compress-Archive -Path "build/windows/src/TurbitoDJ_artefacts/Release/Turbito DJ.exe", LICENSE -DestinationPath $env:ZIP
    env:
      ZIP: TurbitoDJ-${{ matrix.name }}.zip

    steps:
      - uses: actions/checkout@v7

      # Sources and download stamps only: *-build dirs hold per-tree outputs.
      - uses: actions/cache@v6
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.configure }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package
        run: ${{ matrix.package }}

      - uses: actions/upload-artifact@v7
        with:
          name: TurbitoDJ-${{ matrix.name }}-${{ github.sha }}
          path: ${{ env.ZIP }}
          retention-days: 7
          if-no-files-found: error

  # main only accepts PRs from develop (release) or hotfix/*; skipped (= passing) otherwise.
  source-branch:
    name: Source branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Check PR source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop|hotfix/*) ;;
            *) echo "::error::PRs to main must come from develop or hotfix/*, not '$HEAD_REF'"; exit 1 ;;
          esac
